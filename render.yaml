services:
  - type: web
    name: prepmap-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MODEL_REPO
        value: adithegod/prepmap-question-classifier
      - key: DATASET_REPO
        value: adithegod/askedbefore-cs-interview-questions
      - key: HF_HOME
        value: /opt/render/project/src/.hf_cache
